plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.2.21'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jooq.jooq-codegen-gradle' version '3.19.34'
}

group = 'com.tomonakaji'
version = '0.0.1-SNAPSHOT'

def dbHost = System.getenv('BOOK_API_DB_HOST')
def dbPort = System.getenv('BOOK_API_DB_PORT')
def dbName = System.getenv('BOOK_API_DB_NAME')
def dbUser = System.getenv('BOOK_API_DB_USER')
def dbPassword = System.getenv('BOOK_API_DB_PASSWORD')

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	jooqCodegen 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jooq-test'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

kotlin {
	sourceSets.main.kotlin.srcDirs += 'build/generated-src/jooq'
}

tasks.named('compileKotlin') {
	dependsOn tasks.named('jooqCodegen')
}

jooq {
	configuration {
		logging = org.jooq.meta.jaxb.Logging.WARN
		jdbc {
			driver = 'org.postgresql.Driver'
			url = "jdbc:postgresql://${dbHost}:${dbPort}/${dbName}"
			user = dbUser
			password = dbPassword
		}
		generator {
			name = 'org.jooq.codegen.KotlinGenerator'
			database {
				name = 'org.jooq.meta.postgres.PostgresDatabase'
				inputSchema = 'public'
				excludes = 'flyway_schema_history'
			}
			target {
				packageName = 'com.tomonakaji.jooq'
				directory = 'build/generated-src/jooq'
			}
		}
	}
}
